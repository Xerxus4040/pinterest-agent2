<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Pinterest Agent</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>AI Pinterest Agent</h1>
      <p>Academy edition · Drive → AI → Pinterest</p>
    </div>
    <button id="logout" class="ghost hidden">Logout</button>
  </header>

  <section id="login" class="card">
    <h2>Get started</h2>
    <p>Sign in with Google to connect the Drive folder you want the agent to process.</p>
    <a class="button" href="/oauth/google">Connect Google Drive</a>
  </section>

  <main id="dashboard" class="hidden">
    <section class="grid">
      <div class="card">
        <h3>Connections</h3>
        <div id="googleStatus"></div>
        <div id="pinterestStatus"></div>
      </div>

      <div class="card">
        <h3>Drive folder</h3>
        <input id="folder" placeholder="Paste Google Drive folder URL">
        <button id="saveFolder" class="button">Save & Verify Folder</button>
        <p id="folderInfo" class="muted"></p>
      </div>

      <div class="card">
        <h3>Pinterest board</h3>
        <select id="boards"></select>
        <button id="loadBoards" class="button secondary">Refresh Boards</button>
        <p id="boardInfo" class="muted"></p>
      </div>

      <div class="card">
        <h3>Automation</h3>
        <div id="automationState" class="state">Loading…</div>
        <div class="actions">
          <button id="start" class="button">Start</button>
          <button id="pause" class="button danger">Pause</button>
          <button id="scan" class="button secondary">Scan Drive</button>
          <button id="process" class="button secondary">Process One Now</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h3>Job queue</h3>
      <div id="jobs"></div>
    </section>

    <section id="message" class="message hidden"></section>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
